<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inventory & Stock Management</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Login screen -->
  <div id="login-screen" hidden>
    <form id="login-form" class="login-card">
      <div class="brand big"><span class="logo">▦</span> Inventory & Stock</div>
      <p class="muted">Sign in to continue</p>
      <label>Email<input name="Email" type="email" autocomplete="username" required></label>
      <label>Password<input name="Password" type="password" autocomplete="current-password" required></label>
      <p id="login-error" class="error"></p>
      <button type="submit" class="wide">Sign in</button>
      <div id="demo-accounts"></div>
    </form>
  </div>

  <!-- App -->
  <div id="app" hidden>
    <header class="topbar">
      <div class="brand"><span class="logo">▦</span> Inventory & Stock</div>
      <nav id="nav"></nav>
      <div class="user">
        <button id="user-btn" class="ghost"><span id="user-name"></span> <span id="user-role" class="role-chip"></span></button>
        <div id="user-menu" hidden>
          <button id="change-pw" class="ghost">Change password</button>
          <button id="logout" class="ghost">Log out</button>
        </div>
      </div>
    </header>
    <main>
      <div class="page-head">
        <h1 id="title"></h1>
        <div id="toolbar"></div>
      </div>
      <section id="content"></section>
    </main>
  </div>

  <dialog id="dialog">
    <form id="form" method="dialog">
      <h3 id="form-title"></h3>
      <div id="form-fields"></div>
      <p id="form-hint" class="hint"></p>
      <p id="form-error" class="error"></p>
      <div class="form-actions">
        <button type="button" id="form-cancel" class="secondary">Cancel</button>
        <button type="submit">Save</button>
      </div>
    </form>
  </dialog>
  <div id="toast"></div>

  <script src="charts.js"></script>
  <script src="app.js"></script>
</body>
</html>
